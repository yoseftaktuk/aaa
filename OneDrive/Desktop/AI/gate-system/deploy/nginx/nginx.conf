worker_processes auto;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream user_service { server user-service:8000; }
  upstream chip_service { server chip-service:8000; }
  upstream payment_service { server payment-service:8000; }
  upstream hardware_service { server hardware-service:8000; }
  upstream access_service { server access-control-service:8000; }
  upstream dashboard { server dashboard:80; }

  server {
    listen 80;

    # Frontend
    location / {
      proxy_pass http://dashboard;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # APIs
    location /api/users/ {
      proxy_pass http://user_service/;
    }
    location /api/chips/ {
      proxy_pass http://chip_service/;
    }
    location /api/payments/ {
      proxy_pass http://payment_service/;
    }
    location /api/hardware/ {
      proxy_pass http://hardware_service/;
    }
    location /api/access/ {
      proxy_pass http://access_service/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}

